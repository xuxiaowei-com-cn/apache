name: incubator-seata

on:
  push:
    paths:
      - .github/workflows/incubator-seata.yml
      - "*.go"
      - go.sum
      - go.mod
  workflow_dispatch:
    inputs:
      version:
        description: 'Seata version to verify'
        required: true
        default: '2.7.0'
        type: string

env:
  BASE_URL: https://dist.apache.org/repos/dist/dev/incubator/seata
  KEYS_URL: https://downloads.apache.org/incubator/seata/KEYS
  VERSION: ${{ github.event.inputs.version || '2.7.0' }}
  EXPECTED_TAG_SHA: 54b1b017cd4fff55ebbbdb49020d2ae58f9ca706

jobs:
  # ============================================================
  # Step 1: Download all release artifacts, upload as artifact
  # ============================================================
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts (binary)
        run: |
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.asc
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.sha512
      - name: Download release artifacts (source)
        run: |
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-src.zip
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-src.zip.asc
          curl -LO ${{ env.BASE_URL }}/${{ env.VERSION }}/apache-seata-${{ env.VERSION }}-incubating-src.zip.sha512
      - name: Download KEYS
        run: curl -LO ${{ env.KEYS_URL }}
      - name: List downloaded files
        run: ls -lha
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
            apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.asc
            apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.sha512
            apache-seata-${{ env.VERSION }}-incubating-src.zip
            apache-seata-${{ env.VERSION }}-incubating-src.zip.asc
            apache-seata-${{ env.VERSION }}-incubating-src.zip.sha512
            KEYS

  # ============================================================
  # Step 2: All checks run in parallel after download
  # ============================================================
  gpg:
    runs-on: ubuntu-latest
    needs: download
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Import GPG KEYS and verify binary signature
        run: |
          gpg --import KEYS
          gpg --verify apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.asc apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
      - name: Verify source signature
        run: |
          gpg --verify apache-seata-${{ env.VERSION }}-incubating-src.zip.asc apache-seata-${{ env.VERSION }}-incubating-src.zip

  sha512sum:
    runs-on: ubuntu-latest
    needs: download
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Verify binary SHA-512 checksum
        run: sha512sum -c apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.sha512
      - name: Verify source SHA-512 checksum
        run: sha512sum -c apache-seata-${{ env.VERSION }}-incubating-src.zip.sha512

  check-license:
    runs-on: ubuntu-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        module: [ server, namingserver ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Extract binary tarball
        run: tar -zxvf apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
      - name: Display seata-${{ matrix.module }} LICENSE
        run: cat apache-seata-${{ env.VERSION }}-incubating-bin/seata-${{ matrix.module }}/LICENSE

  check-notice:
    runs-on: ubuntu-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        module: [ server, namingserver ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Extract binary tarball
        run: tar -zxvf apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
      - name: Display seata-${{ matrix.module }} NOTICE
        run: cat apache-seata-${{ env.VERSION }}-incubating-bin/seata-${{ matrix.module }}/NOTICE
      - name: Check seata-${{ matrix.module }} NOTICE first line
        run: |
          FIRST_LINE=$(head -n 1 apache-seata-${{ env.VERSION }}-incubating-bin/seata-${{ matrix.module }}/NOTICE)
          EXPECTED="Apache Seata (Incubating)"
          if [ "$FIRST_LINE" != "$EXPECTED" ]; then
            echo "ERROR: Expected first line of seata-${{ matrix.module }}/NOTICE to be '$EXPECTED', but got '$FIRST_LINE'"
            exit 1
          fi
          echo "OK: seata-${{ matrix.module }}/NOTICE first line is '$FIRST_LINE'"
      - name: Check seata-${{ matrix.module }} NOTICE second line
        run: |
          SECOND_LINE=$(head -n 2 apache-seata-${{ env.VERSION }}-incubating-bin/seata-${{ matrix.module }}/NOTICE | tail -n 1)
          CURRENT_YEAR=$(date +%Y)
          echo "CURRENT_YEAR=$CURRENT_YEAR"
          EXPECTED="Copyright 2023-${CURRENT_YEAR} The Apache Software Foundation"
          if [ "$SECOND_LINE" != "$EXPECTED" ]; then
            echo "ERROR: Expected second line of seata-${{ matrix.module }}/NOTICE to be '$EXPECTED', but got '$SECOND_LINE'"
            exit 1
          fi
          echo "OK: seata-${{ matrix.module }}/NOTICE second line is '$SECOND_LINE'"

  check-compile-license:
    runs-on: ubuntu-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17, 21, 25 ]
        source: [ zip, tag, branch ]
    steps:
      # --- Obtain seata source (zip: download+extract; tag/branch: git checkout) ---
      - name: Download artifacts
        if: matrix.source == 'zip'
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Extract source zip
        if: matrix.source == 'zip'
        run: unzip apache-seata-${{ env.VERSION }}-incubating-src.zip
      - name: Compute checkout ref
        if: matrix.source != 'zip'
        id: ref
        run: |
          if [ "${{ matrix.source }}" = "tag" ]; then
            echo "value=v${{ env.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ env.VERSION }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout seata source
        if: matrix.source != 'zip'
        uses: actions/checkout@v3
        with:
          repository: apache/incubator-seata
          ref: ${{ steps.ref.outputs.value }}
          path: incubator-seata
      # --- Compute working directory ---
      - name: Set working directory
        id: workdir
        run: |
          if [ "${{ matrix.source }}" = "zip" ]; then
            echo "value=apache-seata-${{ env.VERSION }}-incubating-src" >> $GITHUB_OUTPUT
          else
            echo "value=incubator-seata" >> $GITHUB_OUTPUT
          fi
      # --- Common: compile, dependency tree, license checks ---
      - name: "Setup Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile with Maven
        working-directory: ${{ steps.workdir.outputs.value }}
        run: ./mvnw -V -B clean install -DskipTests=true
      - name: "Show dependency tree"
        working-directory: ${{ steps.workdir.outputs.value }}
        run: ./mvnw -V -B dependency:tree
      - name: "Export full dependency tree"
        working-directory: ${{ steps.workdir.outputs.value }}
        run: ./mvnw -V -B dependency:tree > tree.txt
      - name: "Export namingserver dependency tree"
        if: matrix.java == 25
        working-directory: ${{ steps.workdir.outputs.value }}
        run: ./mvnw -V -B dependency:tree -pl namingserver > namingserver-tree.txt
      - name: "Export server dependency tree"
        if: matrix.java == 25
        working-directory: ${{ steps.workdir.outputs.value }}
        run: ./mvnw -V -B dependency:tree -pl server > server-tree.txt
      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: apache
      - name: "Check full dependency licenses"
        id: check-full
        continue-on-error: true
        working-directory: apache
        run: go run main.go --file=../${{ steps.workdir.outputs.value }}/tree.txt --license-file=../${{ steps.workdir.outputs.value }}/distribution/LICENSE --exclude-group=org.apache.seata
      - name: "Check server dependency licenses"
        id: check-server
        continue-on-error: true
        working-directory: apache
        if: matrix.java == 25
        run: go run main.go --file=../${{ steps.workdir.outputs.value }}/server-tree.txt --license-file=../${{ steps.workdir.outputs.value }}/distribution/LICENSE-server --exclude-group=org.apache.seata
      - name: "Check namingserver dependency licenses"
        id: check-namingserver
        continue-on-error: true
        working-directory: apache
        if: matrix.java == 25
        run: go run main.go --file=../${{ steps.workdir.outputs.value }}/namingserver-tree.txt --license-file=../${{ steps.workdir.outputs.value }}/distribution/LICENSE-namingserver --exclude-group=org.apache.seata
      - name: "Collect license check results"
        if: always() && matrix.java == 25
        run: |
          FAIL=0
          if [ "${{ steps.check-full.outcome }}" != "success" ]; then
            echo "::error::full dependency licenses check failed"
            FAIL=1
          fi
          if [ "${{ steps.check-server.outcome }}" != "success" ]; then
            echo "::error::server dependency licenses check failed"
            FAIL=1
          fi
          if [ "${{ steps.check-namingserver.outcome }}" != "success" ]; then
            echo "::error::namingserver dependency licenses check failed"
            FAIL=1
          fi
          exit $FAIL
      - name: "Clean up Seata artifacts from local Maven cache"
        if: always()
        run: rm -rf ~/.m2/repository/org/apache/seata

  check-eyes-license:
    runs-on: ubuntu-latest
    needs: download
    strategy:
      fail-fast: false
      matrix:
        source: [ zip, tag, branch ]
    steps:
      # --- Obtain source (zip: download+extract; tag: git checkout) ---
      - name: Download artifacts
        if: matrix.source == 'zip'
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Extract source zip
        if: matrix.source == 'zip'
        run: unzip apache-seata-${{ env.VERSION }}-incubating-src.zip
      - name: List extracted source files
        if: matrix.source == 'zip'
        run: ls -lha
      - name: Move extracted source files to current directory
        if: matrix.source == 'zip'
        run: shopt -s dotglob && mv apache-seata-${{ env.VERSION }}-incubating-src/* . && shopt -u dotglob
      - name: Remove non-compliant license files
        if: matrix.source == 'zip'
        run: |
          rm -rf apache-seata-${{ env.VERSION }}-incubating-src.zip
          rm -rf apache-seata-${{ env.VERSION }}-incubating-src.zip.asc
          rm -rf apache-seata-${{ env.VERSION }}-incubating-src.zip.sha512
          rm -rf apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz
          rm -rf apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.asc
          rm -rf apache-seata-${{ env.VERSION }}-incubating-bin.tar.gz.sha512
          rm -rf KEYS
      - name: Compute checkout ref
        if: matrix.source != 'zip'
        id: ref
        run: |
          if [ "${{ matrix.source }}" = "tag" ]; then
            echo "value=v${{ env.VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ env.VERSION }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout seata source
        if: matrix.source != 'zip'
        uses: actions/checkout@v3
        with:
          repository: apache/incubator-seata
          ref: ${{ steps.ref.outputs.value }}
      # --- Common: skywalking-eyes license checks ---
      - name: Clear cache directory first before trying to restore from cache
        run: sudo rm -rf $(go env GOMODCACHE) && sudo rm -rf $(go env GOCACHE)
        shell: bash
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14.x'
      - name: Check License Header
        uses: apache/skywalking-eyes/header@8fc52baabc14c86294d96034bcc194cfa7f76b05
        with:
          log: info
          config: .licenserc.yaml
          mode: check
      - name: Check Dependencies' License
        uses: apache/skywalking-eyes/dependency@8fc52baabc14c86294d96034bcc194cfa7f76b05
        with:
          log: info
          config: .licenserc.yaml
          mode: check

  check-tag-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: apache/incubator-seata
          ref: v${{ env.VERSION }}
      - name: Verify tag SHA
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Tag v${{ env.VERSION }} points to SHA: $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "${{ env.EXPECTED_TAG_SHA }}" ]; then
            echo "ERROR: Expected tag v${{ env.VERSION }} SHA to be ${{ env.EXPECTED_TAG_SHA }}, but got $ACTUAL_SHA"
            exit 1
          fi
          echo "OK: Tag SHA matches expected value"
